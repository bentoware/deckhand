[package]
name = "deckhand-server"
version = "0.1.11"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1.7.0", features = ["server", "transport-streamable-http-server"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
tower-service = "0.3"

[dev-dependencies]
tempfile = "3"
